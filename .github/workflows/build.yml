name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev libxdo-dev pkg-config

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cp target/release/zmk-battery-applet target/release/zmk-battery-applet-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          path: target/release/zmk-battery-applet-linux-x86_64
          if-no-files-found: error
          # Upload the file itself instead of wrapping it in another zip.
          archive: false

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Create universal app bundle
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/zmk-battery-applet \
            target/aarch64-apple-darwin/release/zmk-battery-applet \
            target/x86_64-apple-darwin/release/zmk-battery-applet
          scripts/bundle-macos.sh target/universal/zmk-battery-applet target/bundle
          cd target/bundle && ditto -c -k --keepParent "ZMK Battery.app" zmk-battery-applet-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          path: target/bundle/zmk-battery-applet-macos-universal.zip
          if-no-files-found: error
          # Upload the file itself instead of wrapping it in another zip.
          archive: false
