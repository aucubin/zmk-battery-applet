name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev libxdo-dev pkg-config

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cp target/release/zmk-battery-applet target/release/zmk-battery-applet-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          path: target/release/zmk-battery-applet-linux-x86_64
          if-no-files-found: error
          # Upload the file itself instead of wrapping it in another zip.
          archive: false

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Create universal app bundle
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/zmk-battery-applet \
            target/aarch64-apple-darwin/release/zmk-battery-applet \
            target/x86_64-apple-darwin/release/zmk-battery-applet
          scripts/bundle-macos.sh target/universal/zmk-battery-applet target/bundle
          cd target/bundle && ditto -c -k --keepParent "ZMK Battery.app" zmk-battery-applet-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          path: target/bundle/zmk-battery-applet-macos-universal.zip
          if-no-files-found: error
          # Upload the file itself instead of wrapping it in another zip.
          archive: false

  release:
    # Runs only for version tags (e.g. v0.2.0), after everything else passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: download
          # The macOS artifact is itself a .zip uploaded with archive: false;
          # keep it as-is instead of extracting the .app.
          skip-decompress: true

      # Flatten whatever layout download-artifact produced into dist/.
      - name: Collect release files
        run: |
          find download -type f -print
          mkdir -p dist
          for f in zmk-battery-applet-macos-universal.zip zmk-battery-applet-linux-x86_64; do
            src="$(find download -type f -name "$f" | head -1)"
            if [[ -z "$src" ]]; then
              echo "::error::$f not found in downloaded artifacts"
              exit 1
            fi
            cp "$src" "dist/$f"
          done
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/zmk-battery-applet-macos-universal.zip \
            dist/zmk-battery-applet-linux-x86_64

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256="$(sha256sum dist/zmk-battery-applet-macos-universal.zip | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/aucubin/homebrew-tap.git" tap
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" \
            -e '/^# /d' \
            packaging/homebrew/zmk-battery-applet.rb > tap/Casks/zmk-battery-applet.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zmk-battery-applet.rb
          git commit -m "zmk-battery-applet $VERSION"
          git push
